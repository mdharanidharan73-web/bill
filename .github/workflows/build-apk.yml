name: Build BillCircle APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '^{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GitHub Actions secret."
          elif [ -s app/google-services.json ]; then
            echo "Using repository app/google-services.json."
          else
            echo "::warning::app/google-services.json is not present and GOOGLE_SERVICES_JSON secret is unset. Building APK without Firebase config (Google Sign-In will fail gracefully at runtime)."
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.BillCircleUnitTest" --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare BillCircle APK artifact
        if: success()
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BillCircle.apk
          ls -lh BillCircle.apk

      - name: Upload BillCircle APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BillCircle-APK
          path: BillCircle.apk
          if-no-files-found: error
